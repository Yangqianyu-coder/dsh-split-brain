<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Split-brain">
  <defs>
    <linearGradient id="sbLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
    <linearGradient id="sbRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0a0"/>
      <stop offset="1" stop-color="#1f9c78"/>
    </linearGradient>
  </defs>
  <!-- 左半球 -->
  <path fill="url(#sbLeft)" d="M29 8c-6 0-11 3-14 7l-4 6c-2 3-1 7 2 9l3 2-2 6c-1 3 1 7 4 8l4 2c1 4 5 6 9 6V8z"/>
  <!-- 右半球：同一形状，向右错开，表示劈开后的平行副本 -->
  <path fill="url(#sbRight)" d="M35 12c6 0 11 3 14 7l3 6c2 3 1 7-2 9l-3 2 2 6c1 3-1 7-4 8l-4 2c-1 4-3 6-6 6V12z"/>
  <!-- 裂口 -->
  <path fill="none" stroke="#1b1f27" stroke-width="2" stroke-linecap="round" d="M32 6l-2 12 3 10-3 12 3 11-2 11"/>
  <!-- 两个半球各自在跑 -->
  <circle cx="20" cy="20" r="2.5" fill="#fff" opacity=".85"/>
  <circle cx="44" cy="24" r="2.5" fill="#fff" opacity=".85"/>
</svg>
